# Nginx host sebagai reverse proxy ke Caddy internal (127.0.0.1:8080).
#
# Pasang:
#   sudo cp deploy/nginx-our-crm.conf /etc/nginx/sites-available/our-crm
#   sudo ln -s /etc/nginx/sites-available/our-crm /etc/nginx/sites-enabled/our-crm
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (setelah DNS domain mengarah ke server ini):
#   sudo certbot --nginx -d crm.codeit.id
#
# Ganti "crm.codeit.id" dengan domain/subdomain CRM yang dipakai.
# Jangan pakai domain yang sudah dipakai situs lain (cek: sudo nginx -T | grep server_name).

# Wajib untuk WebSocket. Kalau nginx -t error "duplicate map", hapus blok ini
# (berarti konfigurasi Nginx lain sudah punya map dengan nama sama).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.codeit.id;

    # Biar certbot bisa verifikasi lewat HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (/ws/livechat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE (/api/v1/livechat/sse) dan koneksi panjang
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 25m;
    }
}
