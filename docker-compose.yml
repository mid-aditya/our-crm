services:
  postgres-master:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: crm_master
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MASTER_DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgmaster:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

volumes:
  pgmaster:
  redisdata:
