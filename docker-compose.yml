name: our-crm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crm_master
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d crm_master"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # Sengaja tidak ada "ports": Postgres hanya bisa diakses dari jaringan compose.

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      API_PORT: "3001"
      # DSN dirakit di sini supaya password tidak perlu ditulis dua kali.
      MASTER_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/crm_master?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    # Aplikasi ini dilayani di belakang Nginx host (yang sudah memakai 80/443).
    # Caddy hanya HTTP di localhost; TLS + domain diatur Nginx.
    # Kalau tidak ada Nginx di host, ubah menjadi "80:80" dan "443:443".
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
